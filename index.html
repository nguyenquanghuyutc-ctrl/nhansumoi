<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Onboarding - Lalia Việt Nam</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .form-container { background: white; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="max-w-lg w-full">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-extrabold text-blue-900 tracking-tight uppercase">Công ty TNHH Lalia Việt Nam</h1>
            <p class="text-gray-500 font-medium">Hệ thống đăng ký nhân sự mới</p>
        </div>

        <div class="form-container p-8">
            <form id="onboardingForm" class="space-y-5">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Họ và tên nhân viên *</label>
                    <input type="text" name="hoTen" placeholder="VD: NGUYỄN VĂN A" required class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition-all">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">Phòng ban *</label>
                        <select name="phongBan" required class="w-full p-3 border border-gray-300 rounded-lg bg-white">
                            <option value="">-- Chọn --</option>
                            <option value="BAN GIÁM ĐỐC">BAN GIÁM ĐỐC</option>
                            <option value="KINH DOANH">KINH DOANH</option>
                            <option value="KẾ TOÁN">KẾ TOÁN</option>
                            <option value="HÀNH CHÍNH">HÀNH CHÍNH</option>
                            <option value="KỸ THUẬT">KỸ THUẬT</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">Chức vụ *</label>
                        <select name="chucVu" required class="w-full p-3 border border-gray-300 rounded-lg bg-white">
                            <option value="">-- Chọn --</option>
                            <option value="GIÁM ĐỐC">GIÁM ĐỐC</option>
                            <option value="PHÓ GIÁM ĐỐC">PHÓ GIÁM ĐỐC</option>
                            <option value="GIÁM SÁT">GIÁM SÁT</option>
                            <option value="TRƯỞNG NHÓM">TRƯỞNG NHÓM</option>
                            <option value="NHÂN VIÊN">NHÂN VIÊN</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">Hình thức LV *</label>
                        <select name="htlv" required class="w-full p-3 border border-gray-300 rounded-lg bg-white text-blue-700 font-semibold">
                            <option value="">-- Chọn --</option>
                            <option value="Chính thức">Chính thức</option>
                            <option value="Thử việc">Thử việc</option>
                            <option value="Cộng tác viên">Cộng tác viên</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">Nơi làm việc *</label>
                        <select name="noiLamViec" required class="w-full p-3 border border-gray-300 rounded-lg bg-white">
                            <option value="">-- Chọn --</option>
                            <option value="Công ty">Tại Công ty</option>
                            <option value="Thanh Hóa">Thanh Hóa</option>
                            <option value="NPP Hoàng Anh">NPP Hoàng Anh</option>
                            <option value="NPP Ngọc Điệp">NPP Ngọc Điệp</option>
                            <option value="NPP Lanh Hòa">NPP Lanh Hòa</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Số điện thoại liên hệ *</label>
                    <input type="tel" name="sdt" pattern="[0-9]{10,11}" placeholder="Số điện thoại cá nhân" required class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                </div>

                <div class="bg-blue-50 p-4 rounded-lg space-y-3">
                    <p class="text-xs font-bold text-blue-800 uppercase italic">Thông tin nhận lương</p>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-gray-600">Ngân hàng *</label>
                            <select name="nganHang" required class="w-full p-2 border border-gray-200 rounded md bg-white text-sm">
                                <option value="">-- Chọn --</option>
                                <option value="TECHCOMBANK">TECHCOMBANK</option>
                                <option value="VIETINBANK">VIETINBANK</option>
                                <option value="BIDV">BIDV</option>
                                <option value="VPBANK">VPBANK</option>
                                <option value="MB">MB BANK</option>
                                <option value="AGRIBANK">AGRIBANK</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-600">Số tài khoản *</label>
                            <input type="text" name="stk" required class="w-full p-2 border border-gray-200 rounded bg-white text-sm">
                        </div>
                    </div>
                </div>

                <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-800 text-white font-bold py-4 rounded-xl transition shadow-lg active:scale-95">
                    HOÀN TẤT ĐĂNG KÝ
                </button>
            </form>

            <div id="successBox" class="hidden text-center py-10 space-y-4">
                <div class="inline-flex items-center justify-center w-16 h-16 bg-green-100 rounded-full mb-2">
                    <svg class="w-8 h-8 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                </div>
                <h2 class="text-2xl font-bold text-gray-800">Chào mừng thành viên mới!</h2>
                <p class="text-gray-600">Dữ liệu của bạn đã được đồng bộ vào hệ thống quản lý.</p>
                <div class="p-4 bg-gray-100 rounded-lg">
                    <p class="text-sm text-gray-500 uppercase font-bold">Mã nhân viên của bạn là:</p>
                    <p id="displayMaNV" class="text-3xl font-black text-blue-700 mt-1">---</p>
                </div>
                <p class="text-xs text-red-500">* Vui lòng ghi nhớ Mã NV để đăng nhập vào AppSheet.</p>
            </div>
        </div>
    </div>

    <script>
        // THAY LINK NÀY BẰNG LINK WEB APP SAU KHI DEPLOY STANDALONE GAS
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwgQ5ncD6bcSVqDvXhaR7pLKusCsC7Ngb_dgWqMFSzPqh0RcGiJfvuTBx7qr-4pCsNhtw/exec";

        const form = document.getElementById('onboardingForm');
        const btn = document.getElementById('submitBtn');
        const successBox = document.getElementById('successBox');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            btn.disabled = true;
            btn.innerText = "ĐANG TẠO MÃ NHÂN VIÊN...";

            const formData = new FormData(form);
            const payload = Object.fromEntries(formData.entries());

            try {
                // Sử dụng fetch với redirect xử lý cho Google Apps Script
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                
                const result = await response.json();
                
                if (result.result === "success") {
                    form.classList.add('hidden');
                    successBox.classList.remove('hidden');
                    document.getElementById('displayMaNV').innerText = result.maNV;
                } else {
                    throw new Error(result.message);
                }
            } catch (error) {
                console.error(error);
                alert("Có lỗi xảy ra: " + error.message + "\nTuy nhiên dữ liệu có thể đã được lưu. Hãy kiểm tra Sheet.");
                btn.disabled = false;
                btn.innerText = "THỬ LẠI";
            }
        });
    </script>
</body>
</html>
